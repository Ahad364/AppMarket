name: Build APK

on:
  push:
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare signing key
        env:
          P1: ${{ secrets.KEYSTORE_PART1 }}
          P2: ${{ secrets.KEYSTORE_PART2 }}
          P3: ${{ secrets.KEYSTORE_PART3 }}
        run: |
          echo "Part lengths: ${#P1} ${#P2} ${#P3} (expected 1200 1200 1120)"
          if [ -n "$P1" ]; then
            printf '%s%s%s' "$P1" "$P2" "$P3" | base64 -d > "$RUNNER_TEMP/appmarket.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/appmarket.jks" >> "$GITHUB_ENV"
          fi
      - name: Verify keystore
        run: |
          if [ -n "$KEYSTORE_PATH" ]; then
            ls -l "$KEYSTORE_PATH"
            sha256sum "$KEYSTORE_PATH"
            keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD"
          else
            echo "No keystore secret found, debug key will be used"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: appmarket-debug-apk
          path: app/build/outputs/apk/debug/*.apk
