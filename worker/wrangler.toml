name = "appmarket-download"
main = "src/index.js"
compatibility_date = "2025-01-01"

# R2 bucket binding (bucket created in the Cloudflare dashboard)
[[r2_buckets]]
binding = "APK_BUCKET"
bucket_name = "appmarket-apks"

# Not secret. Replace with your Realtime Database URL (shown at the top of the
# Firebase Console → Realtime Database page), no trailing slash.
[vars]
FIREBASE_DB_URL = "https://REPLACE-WITH-YOUR-DB-URL.firebasedatabase.app"

# Secrets (do NOT put these in this file):
#   Dashboard → Worker → Settings → Variables and Secrets → Add → Secret
#   FIREBASE_API_KEY     : the current_key from google-services.json
#   FCM_SERVICE_ACCOUNT  : the full JSON of the service account key file
